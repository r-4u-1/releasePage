<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Release page</title>
  <link href="style.css" rel="stylesheet"/>
</head>
<body>
  <main class="card">
    <h1>Create a release page</h1>
    <p class="sub">Lists every merged change between two tags of an app and publishes it as a Confluence page.</p>

    <form id="mainForm">
      <div class="field full-width">
        <label for="repo">Path to monorepo</label>
        <input type="text" id="repo" placeholder="C:\git\monorepo" autocomplete="off" spellcheck="false"/>
        <span class="err-msg" id="e-repo"></span>
      </div>

      <div class="token-status checking full-width" id="token-status">
        <span class="token-status-dot"></span>
        <span id="token-status-text">Checking the Confluence token…</span>
        <button type="button" class="token-status-btn" id="token-recheck" hidden>Check again</button>
      </div>

      <div class="field full-width">
        <label for="app">App</label>
        <select id="app"><option value="">Enter the monorepo path first</option></select>
        <span class="err-msg" id="e-app"></span>
      </div>

      <div class="field">
        <label for="version">Version</label>
        <input type="text" id="version" placeholder="1.4.0" autocomplete="off"/>
      </div>
      <div class="field">
        <label for="eventdate">Date</label>
        <input type="date" id="eventdate"/>
      </div>

      <div class="field">
        <label for="tagfrom">From tag (OLD)</label>
        <select id="tagfrom"><option value="">Select an app first</option></select>
      </div>
      <div class="field">
        <label for="tagto">To tag (NEW)</label>
        <select id="tagto"><option value="">Select an app first</option></select>
      </div>

      <div class="submit-row full-width">
        <button type="submit" id="submitBtn">Create page</button>
        <span class="status-msg" id="statusMsg"></span>
      </div>
    </form>
  </main>

  <script src="form.js"></script>
</body>
</html>
