<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Release page</title>
</head>
<body>
  <h1>Create a release page</h1>

  <form id="releaseForm">
    <p><label>App <input id="app" placeholder="web-app"/></label></p>
    <p><label>Version <input id="version" placeholder="1.4.0"/></label></p>
    <p><label>Date <input id="date" type="date"/></label></p>
    <p><label>From tag <input id="from" placeholder="web-app-12-OLD"/></label></p>
    <p><label>To tag <input id="to" placeholder="web-app-12-NEW"/></label></p>
    <button type="submit">Create page</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById('releaseForm');
    const status = document.getElementById('status');
    const value = id => document.getElementById(id).value;

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const release = {
        app: value('app'),
        version: value('version'),
        date: value('date'),
        from: value('from'),
        to: value('to'),
      };

      status.textContent = 'Creating the release page…';
      const response = await fetch('/api/release', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(release),
      });
      const data = await response.json();

      if (!data.ok) {
        status.textContent = data.message;
        return;
      }
      status.innerHTML = `Release page created with ${data.pullRequestCount} PRs — <a href="${data.pageUrl}" target="_blank">open in Confluence</a>`;
    });
  </script>
</body>
</html>
